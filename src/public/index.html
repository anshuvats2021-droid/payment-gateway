<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Razorpay Payment Gateway</title>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  </head>

  <body>
    <h1>Razorpay Payment Gateway</h1>

    <button id="payButton">Pay Now</button>

    <script>
      async function payNow() {
        try {
          // Check whether Axios is loaded
          if (typeof axios === "undefined") {
            throw new Error(
              "Axios is not loaded. Check your internet connection.",
            );
          }

          // Create order from backend
          const response = await axios.post(
            "http://localhost:3000/api/payments/6acf1269233a8e4b3af21dd8/order",
          );

          const data = response.data;

          console.log("Order created:", data);

          // Razorpay Checkout options
          const options = {
            key: data.keyId,
            order_id: data.orderId,
            amount: data.amount,
            currency: data.currency,

            name: "Kapda Co.",
            description: "Payment for order " + data.orderId,

            handler: async function (paymentResponse) {
              await axios.post("http://localhost:3000/api/payments/verify", {
                orderId: response.razorpay_order_id,
                paymentId: response.razorpay_payment_id,
                signature: response.razorpay_signature,
              });

              console.log("Razorpay Payment Response:", paymentResponse);

              // Verify payment on backend before confirming an order
              try {
                const verifyResponse = await axios.post(
                  "http://localhost:3000/api/payments/verify",
                  paymentResponse,
                );

                console.log("Verification response:", verifyResponse.data);
              } catch (error) {
                console.error(
                  "Payment verification failed:",
                  error.response?.data || error.message,
                );
              }
            },

            modal: {
              ondismiss: function () {
                console.log("Payment popup closed");
              },
            },

            theme: {
              color: "#3399cc",
            },
          };

          // Open Razorpay Checkout
          const rzp = new window.Razorpay(options);

          rzp.on("payment.failed", function (paymentError) {
            console.error("Payment failed:", paymentError.error);
          });

          rzp.open();
        } catch (error) {
          console.error(
            "Payment error:",
            error.response?.data || error.message,
          );
        }
      }

      // Button click event
      document.getElementById("payButton").addEventListener("click", payNow);
    </script>
  </body>
</html>
